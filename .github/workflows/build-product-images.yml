name: Build product image assets

on:
  push:
    branches: [feat/ecommerce-checkout]
    paths:
      - 'scripts/product-images.json'
      - '.github/workflows/build-product-images.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode product images
        run: |
          python - <<'PY'
          import base64, json
          from pathlib import Path
          data=json.loads(Path('scripts/product-images.json').read_text())
          out=Path('public/products'); out.mkdir(parents=True, exist_ok=True)
          for name,payload in data.items():
              (out/f'{name}.webp').write_bytes(base64.b64decode(payload))
          PY
      - name: Commit generated assets
        run: |
          rm -f scripts/product-images.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/products scripts/product-images.json
          git diff --cached --quiet && exit 0
          git commit -m 'feat: add product images extracted from Ecuador catalog'
          git push